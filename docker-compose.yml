name: template

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth" ]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

