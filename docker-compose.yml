name: butcher

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: butcher
      POSTGRES_PASSWORD: butcher
      POSTGRES_DB: butcher
    volumes:
      - pgdata_butcher:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - alphomega-network


volumes:
  pgdata_butcher:

networks:
  alphomega-network:
    external: true
